name: Build OpenClaw Gateway MSIX

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: openclaw/openclaw tag, branch, or commit to package
        required: true
        default: 0965053fe6b9341776df147a6934b7485c60b5ca
        type: string
      signing_mode:
        description: Package signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test
          - official

concurrency:
  group: gateway-msix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  OPENCLAW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openclaw_ref || '0965053fe6b9341776df147a6934b7485c60b5ca' }}
  PACKAGING_ROOT: .

jobs:
  changes:
    name: Classify pull request changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect packaging changes
        id: filter
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            'packaging=true' >> $env:GITHUB_OUTPUT
            return
          }

          $fileListPath = Join-Path $env:RUNNER_TEMP 'pull-request-files.json'
          & gh api `
            --paginate `
            --slurp `
            "repos/$env:GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" `
            > $fileListPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate pull request files.'
          }

          $packaging = .\scripts\Get-PackagingRelevance.ps1 `
            -FileListPath $fileListPath
          "packaging=$packaging" >> $env:GITHUB_OUTPUT

  test-host:
    name: Test Gateway MSIX host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore .\OpenClaw.Gateway.MSIX.slnx

      - name: Static analysis
        shell: pwsh
        run: >
          .\scripts\Test-DotNetQuality.ps1
          -Configuration Release
          -SkipRestore

      - name: Test
        run: >
          dotnet test .\OpenClaw.Gateway.MSIX.slnx
          --configuration Release
          --no-restore

      # The xUnit suite runs under a JIT test host, so it cannot prove the
      # native entrypoint alias and root command name, or that
      # System.CommandLine survives trimming and ahead-of-time compilation.
      # This publishes the scenario driver in tests\OpenClaw.Launcher.AotSmoke,
      # which runs the shared startup path with fixture-owned diagnostics
      # instead of the production Main, so nothing is written outside the
      # temporary directory the script owns. x64 only: windows-latest cannot
      # execute an ARM64 binary, and both architectures are still compiled by
      # the packaging matrix.
      - name: Test NativeAOT clawctl command line
        shell: pwsh
        run: >
          .\scripts\Test-NativeAotCli.Tests.ps1
          -Configuration Release

      - name: Test signing policy
        shell: pwsh
        run: >
          .\scripts\Test-SigningInputs.Tests.ps1

      - name: Test Node.js packaging inputs
        shell: pwsh
        run: .\scripts\Test-NodeRuntimeInputs.Tests.ps1

      - name: Test signing workflow configuration
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowSigningConfiguration.ps1

      - name: Test OpenClaw build identity validation
        shell: pwsh
        run: >
          .\scripts\Test-OpenClawBuildIdentity.Tests.ps1

      - name: Test workflow package version
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowPackageVersion.Tests.ps1

      - name: Test packaging relevance
        shell: pwsh
        run: >
          .\scripts\Test-PackagingRelevance.Tests.ps1

      - name: Test local package deployment
        shell: pwsh
        run: >
          .\scripts\Test-Deploy-LocalPackage.Tests.ps1

      - name: Test MSIX bundle build
        shell: pwsh
        run: >
          .\scripts\Test-Build-MSIXBundle.Tests.ps1

      - name: Test Git hooks
        shell: pwsh
        run: >
          .\scripts\Test-GitHooks.Tests.ps1

  build-package:
    name: Build OpenClaw npm package
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
      node_version: ${{ steps.source.outputs.node_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The OpenClaw checkout below must own GITHUB_WORKSPACE because its
      # composite setup action resolves workspace files from that root. Keep
      # the packaging-owned validator outside the workspace before replacing
      # this checkout with the OpenClaw source tree.
      - name: Stage build identity validator
        shell: pwsh
        run: >
          Copy-Item
          ./scripts/Test-OpenClawBuildIdentity.ps1
          $env:RUNNER_TEMP/Test-OpenClawBuildIdentity.ps1

      - name: Check out OpenClaw source
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ env.OPENCLAW_REF }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up upstream Node.js and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: pnpm build

      - name: Validate OpenClaw build identities
        shell: pwsh
        run: >
          & "$env:RUNNER_TEMP/Test-OpenClawBuildIdentity.ps1"
          -OpenClawDirectory $env:GITHUB_WORKSPACE

      - name: Pack npm package
        id: source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          node_version="$(node -p 'process.versions.node')"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "node_version=${node_version}" >> "${GITHUB_OUTPUT}"

          cat > "${artifact_dir}/source.json" <<EOF
          {
            "repository": "https://github.com/openclaw/openclaw",
            "requestedRef": "${OPENCLAW_REF}",
            "resolvedCommit": "${source_sha}",
            "packageVersion": "${package_version}",
            "nodeVersion": "${node_version}"
          }
          EOF

      - name: Upload intermediate package
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          if-no-files-found: error
          retention-days: 7

  build-msix:
    name: Build unsigned ${{ matrix.architecture }} Gateway MSIX
    needs:
      - test-host
      - build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.build-package.outputs.node_version }}

      - name: Download intermediate package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Build expanded payload
        shell: pwsh
        run: |
          .\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Upload payload
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore NativeAOT and MSIX dependencies
        shell: pwsh
        run: |
          dotnet restore `
            .\src\OpenClaw.Launcher\OpenClaw.Launcher.csproj `
            --runtime 'win-${{ matrix.architecture }}' `
            -p:PublishAot=true `
            -p:IncludePackagingContent=true `
            -p:Platform='${{ matrix.architecture }}'

      - name: Compose unsigned MSIX
        shell: pwsh
        env:
          SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || 'unsigned' }}
        run: |
          $versionParameters = @{
            RunNumber = '${{ github.run_number }}'
            RunAttempt = '${{ github.run_attempt }}'
          }
          if ($env:SIGNING_MODE -eq 'official') {
            $policy = Get-Content -LiteralPath .\release-policy.json -Raw |
              ConvertFrom-Json
            $versionParameters.ReleaseVersion = [string]$policy.packageVersion
          }
          $packageVersion = .\scripts\Get-WorkflowPackageVersion.ps1 `
            @versionParameters

          .\scripts\Build-MSIX.ps1 `
            -PayloadDirectory '${{ runner.temp }}\openclaw-payload' `
            -Architecture '${{ matrix.architecture }}' `
            -PackageVersion $packageVersion `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-msix'

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-unsigned-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}\openclaw-msix\OpenClawGateway-${{ matrix.architecture }}.msix
            ${{ runner.temp }}\openclaw-msix\msix-metadata.json
          if-no-files-found: error
          retention-days: 7

  test-sign-msix:
    name: Test-sign Gateway MSIX packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'test' }}
    needs: build-msix
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Apply temporary test signature
        shell: pwsh
        run: |
          .\scripts\Sign-TestMSIX.ps1 `
            -ArtifactsDirectory artifacts `
            -OutputDirectory test-signed

      - name: Upload test-signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-x64
          path: test-signed\x64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload test-signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-arm64
          path: test-signed\arm64\
          if-no-files-found: error
          retention-days: 7

  build-msix-bundle:
    name: Build unsigned multi-architecture Gateway MSIX bundle
    needs: build-msix
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Compose unsigned multi-architecture MSIX bundle
        shell: pwsh
        env:
          SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || 'unsigned' }}
        run: |
          $versionParameters = @{
            RunNumber = '${{ github.run_number }}'
            RunAttempt = '${{ github.run_attempt }}'
          }
          if ($env:SIGNING_MODE -eq 'official') {
            $policy = Get-Content -LiteralPath .\release-policy.json -Raw |
              ConvertFrom-Json
            $versionParameters.ReleaseVersion = [string]$policy.packageVersion
          }
          $packageVersion = .\scripts\Get-WorkflowPackageVersion.ps1 `
            @versionParameters

          .\scripts\Build-MSIXBundle.ps1 `
            -X64Package artifacts\x64\OpenClawGateway-x64.msix `
            -Arm64Package artifacts\arm64\OpenClawGateway-arm64.msix `
            -PackageVersion $packageVersion `
            -OutputPath artifacts\bundle\OpenClawGateway.msixbundle

      - name: Upload unsigned multi-architecture MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle\OpenClawGateway.msixbundle
          if-no-files-found: error
          retention-days: 7

  reject-untrusted-official-signing:
    name: Reject official signing outside main
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'official' && github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - name: Reject untrusted workflow ref
        shell: pwsh
        run: |
          throw (
            'Official Gateway MSIX signing may be dispatched only from main. ' +
            'Use unsigned or test mode for other branches.'
          )

  authorize-signing:
    name: Authorize official Gateway MSIX signing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'official' && github.ref == 'refs/heads/main' }}
    needs:
      - build-msix
      - build-msix-bundle
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Download unsigned multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle

      - name: Resolve official release metadata
        id: release
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath .\release-policy.json -Raw |
            ConvertFrom-Json
          $releaseTag = ([string]$policy.releaseTag).Trim()
          $packageVersion = .\scripts\Get-WorkflowPackageVersion.ps1 `
            -RunNumber '${{ github.run_number }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -ReleaseVersion ([string]$policy.packageVersion)

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$($releaseTag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Enforce official signing policy
        shell: pwsh
        env:
          OPENCLAW_REF: ${{ inputs.openclaw_ref }}
          PACKAGING_COMMIT: ${{ github.sha }}
        run: |
          .\scripts\Test-SigningInputs.ps1 `
            -ArtifactsDirectory artifacts `
            -PolicyPath .\release-policy.json `
            -BundlePath artifacts\bundle\OpenClawGateway.msixbundle `
            -RequestedRef $env:OPENCLAW_REF `
            -PackagingCommit $env:PACKAGING_COMMIT

  sign-msix:
    name: Officially sign Gateway MSIX packages
    if: ${{ needs.authorize-signing.result == 'success' }}
    needs:
      - build-msix
      - build-msix-bundle
      - authorize-signing
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Download unsigned multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign standalone MSIX packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: artifacts
          files-folder-filter: msix
          files-folder-recurse: true
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign multi-architecture MSIX bundle
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files: ${{ github.workspace }}\artifacts\bundle\OpenClawGateway.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and refresh metadata
        shell: pwsh
        run: |
          $expectedSubject = 'CN=OpenClaw Foundation, O=OpenClaw Foundation, L=Mill Valley, S=California, C=US'
          foreach ($architecture in @('x64', 'arm64')) {
            $directory = Join-Path 'artifacts' $architecture
            $msix = Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File
            if (@($msix).Count -ne 1) {
              throw "Expected one signed MSIX in $directory."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $msix.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($msix.Name) signature status was $($signature.Status)."
            }
            if (-not [string]::Equals(
              $signature.SignerCertificate.Subject,
              $expectedSubject,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "$($msix.Name) signer was unexpected: $($signature.SignerCertificate.Subject)"
            }

            $metadataPath = Join-Path $directory 'msix-metadata.json'
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.sha256 = (
              Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata | ConvertTo-Json |
              Set-Content -LiteralPath $metadataPath -Encoding utf8
          }

          $bundle = Get-Item `
            -LiteralPath artifacts\bundle\OpenClawGateway.msixbundle
          $bundleSignature = Get-AuthenticodeSignature `
            -LiteralPath $bundle.FullName
          if ($bundleSignature.Status -ne 'Valid') {
            throw "$($bundle.Name) signature status was $($bundleSignature.Status)."
          }
          if (-not [string]::Equals(
            $bundleSignature.SignerCertificate.Subject,
            $expectedSubject,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw (
              "$($bundle.Name) signer was unexpected: " +
              $bundleSignature.SignerCertificate.Subject
            )
          }

      - name: Upload signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-x64
          path: artifacts\x64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-arm64
          path: artifacts\arm64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed multi-architecture MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-bundle
          path: artifacts\bundle\OpenClawGateway.msixbundle
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish signed Gateway MSIX release
    if: ${{ needs.sign-msix.result == 'success' }}
    needs:
      - authorize-signing
      - sign-msix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-x64
          path: signed/x64

      - name: Download signed ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-arm64
          path: signed/arm64

      - name: Download signed multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-bundle
          path: signed/bundle

      - name: Stage versioned release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.authorize-signing.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp signed/x64/OpenClawGateway-x64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-x64.msix"
          cp signed/arm64/OpenClawGateway-arm64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-arm64.msix"
          cp signed/bundle/OpenClawGateway.msixbundle \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}.msixbundle"

      - name: Create permanent GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.authorize-signing.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: OpenClaw Gateway MSIX ${{ needs.authorize-signing.outputs.release_tag }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.msix
            release-assets/*.msixbundle
          body: |
            Packages OpenClaw Gateway `${{ needs.authorize-signing.outputs.release_tag }}`
            from [`openclaw/openclaw@${{ inputs.openclaw_ref }}`](https://github.com/openclaw/openclaw/commit/${{ inputs.openclaw_ref }}).

            ### Downloads
            - **Recommended:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}.msixbundle`
            - **x64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-x64.msix`
            - **ARM64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-arm64.msix`

            The packages are signed by OpenClaw Foundation through Azure Artifact Signing.

  ci-gate:
    name: Gateway MSIX CI
    if: ${{ always() }}
    needs:
      - changes
      - test-host
      - build-package
      - build-msix
      - test-sign-msix
      - build-msix-bundle
      - reject-untrusted-official-signing
      - authorize-signing
      - sign-msix
      - publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: |
          echo "One or more required workflow jobs failed or were cancelled." >&2
          exit 1

      - name: Confirm workflow success
        shell: bash
        run: echo "All required workflow jobs succeeded or were intentionally skipped."
