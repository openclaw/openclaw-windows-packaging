name: Build OpenClaw Gateway MSIX

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: Empty follows stable; store/official also accept a full SHA matching stable; other refs are unsigned/test only
        required: false
        default: ''
        type: string
      gateway_version:
        description: Optional older exact stable payload; MSIX identity remains on release-policy stableVersion or npm latest
        required: false
        default: ''
        type: string
      signing_mode:
        description: Package signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test
          - store
          - official
      publish_release:
        description: Publish the signed sideload packages as a GitHub Release
        required: true
        default: true
        type: boolean

concurrency:
  group: gateway-msix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

cache-mode: read

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 24.21.0
  PACKAGING_ROOT: .

jobs:
  changes:
    name: Classify pull request changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
      payload_artifact: ${{ steps.filter.outputs.payload_artifact }}
      versioning: ${{ steps.filter.outputs.versioning }}
      upgrade_matrix: ${{ steps.filter.outputs.upgrade_matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect packaging changes
        id: filter
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            'packaging=true' >> $env:GITHUB_OUTPUT
            'payload_artifact=true' >> $env:GITHUB_OUTPUT
            'versioning=false' >> $env:GITHUB_OUTPUT
            return
          }

          $fileListPath = Join-Path $env:RUNNER_TEMP 'pull-request-files.json'
          & gh api `
            --paginate `
            --slurp `
            "repos/$env:GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" `
            > $fileListPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate pull request files.'
          }

          $packaging = .\scripts\Get-PackagingRelevance.ps1 `
            -FileListPath $fileListPath
          "packaging=$packaging" >> $env:GITHUB_OUTPUT

          $pages = Get-Content -LiteralPath $fileListPath -Raw |
            ConvertFrom-Json
          $payloadArtifact = .\scripts\Get-PackagingRelevance.ps1 `
            -FileListPath $fileListPath `
            -PayloadArtifact
          "payload_artifact=$payloadArtifact" >> $env:GITHUB_OUTPUT

          $versioningPaths = @(
            '.github/workflows/gateway-msix.yml'
            '.github/workflows/gateway-msix-build.yml'
            'scripts/Select-WorkflowBuild.ps1'
            'release-policy.json'
            'scripts/Sign-TestMSIX.ps1'
            'scripts/OpenClawSource.ps1'
            'scripts/Get-WorkflowSource.ps1'
            'scripts/Test-OpenClawSource.Tests.ps1'
            'scripts/Get-MSIXReleaseIdentity.ps1'
            'scripts/Get-MSIXUpgradeMatrix.ps1'
            'scripts/Test-MSIXReleaseIdentity.Tests.ps1'
            'scripts/Test-MSIXStoreUpgrade.ps1'
            'scripts/Test-MSIXUpgrade.ps1'
            'scripts/Test-MSIXUpgradeMatrix.Tests.ps1'
            'scripts/Assert-WorkflowJobResults.ps1'
            'scripts/Test-WorkflowJobResults.Tests.ps1'
            'scripts/Test-WorkflowSigningConfiguration.ps1'
            'scripts/msix-upgrade-baselines.json'
          )
          $versioning = 'false'
          foreach ($page in @($pages)) {
            foreach ($file in @($page)) {
              if ([string]$file.filename -in $versioningPaths) {
                $versioning = 'true'
              }
            }
          }
          "versioning=$versioning" >> $env:GITHUB_OUTPUT

          $upgradeMatrix = .\scripts\Get-MSIXUpgradeMatrix.ps1
          "upgrade_matrix=$upgradeMatrix" >> $env:GITHUB_OUTPUT

  # Advisory only. This job annotates documentation-reference findings but is
  # deliberately absent from ci-gate's needs, so it can never block a merge.
  # Run .\scripts\Test-DocReferences.ps1 without -Advisory locally for a
  # nonzero exit on findings.
  docs:
    name: Check documentation references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check documentation references
        shell: pwsh
        run: ./scripts/Test-DocReferences.ps1 -Advisory

  # Documentation-only pull requests skip the host tests; the classification
  # lives in scripts\Get-PackagingRelevance.ps1.
  test-host:
    name: Test Gateway MSIX host
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true' }}
    needs: changes
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore
        run: dotnet restore .\OpenClaw.Gateway.MSIX.slnx

      - name: Static analysis
        shell: pwsh
        run: >
          .\scripts\Test-DotNetQuality.ps1
          -Configuration Release
          -SkipRestore

      # A test that never completes would otherwise hold this job until the
      # six-hour limit. Blame aborts after three minutes without test activity,
      # names the unfinished test, and keeps a minidump for the upload below.
      - name: Test
        run: >
          dotnet test .\OpenClaw.Gateway.MSIX.slnx
          --configuration Release
          --no-restore
          --blame-hang-timeout 3min
          --blame-hang-dump-type mini
          --results-directory TestResults
          --logger "trx;LogFileName=coverage.trx"

      - name: Collect and summarize test coverage
        id: coverage
        if: ${{ success() }}
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\Measure-Coverage.ps1 `
            -OutputDirectory .\CoverageResults `
            -Uncovered
          [IO.File]::AppendAllText(
            $env:GITHUB_STEP_SUMMARY,
            [IO.File]::ReadAllText('.\CoverageResults\summary.md') + [Environment]::NewLine)

      - name: Warn if coverage reporting fails
        if: ${{ steps.coverage.outcome == 'failure' }}
        shell: pwsh
        run: Write-Host '::warning title=Coverage reporting failed::Coverage is advisory. Inspect the failed coverage step and available test results artifact.'

      - name: Upload test and coverage results
        id: results_upload
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gateway-msix-test-results
          path: |
            TestResults
            CoverageResults
          if-no-files-found: warn
          retention-days: 7

      - name: Warn if results upload fails
        if: ${{ always() && steps.results_upload.outcome == 'failure' }}
        shell: pwsh
        run: Write-Host '::warning title=Test results upload failed::Artifact service error. Inspect the failed Upload test and coverage results step logs; test results may be unavailable.'

      # The xUnit suite runs under a JIT test host, so it cannot prove the
      # native entrypoint alias and root command name, or that
      # System.CommandLine survives trimming and ahead-of-time compilation.
      # This publishes the scenario driver in tests\OpenClaw.Launcher.AotSmoke,
      # which runs the shared startup path with fixture-owned diagnostics
      # instead of the production Main, so nothing is written outside the
      # temporary directory the script owns. x64 only: windows-latest cannot
      # execute an ARM64 binary, and both architectures are still compiled by
      # the packaging matrix.
      - name: Test NativeAOT clawctl command line
        shell: pwsh
        run: >
          .\scripts\Test-NativeAotCli.Tests.ps1
          -Configuration Release

      - name: Test signing policy
        shell: pwsh
        run: >
          .\scripts\Test-SigningInputs.Tests.ps1

      - name: Test MSIX test signing
        shell: pwsh
        run: >
          .\scripts\Test-Sign-TestMSIX.Tests.ps1

      - name: Test MSIX upgrade safety
        shell: pwsh
        run: >
          .\scripts\Test-MSIXUpgradeSafety.Tests.ps1

      - name: Test Node.js packaging inputs
        shell: pwsh
        run: .\scripts\Test-NodeRuntimeInputs.Tests.ps1

      - name: Test MXC packaging inputs
        shell: pwsh
        run: .\scripts\Test-Get-MxcRuntime.Tests.ps1

      - name: Test signing workflow configuration
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowSigningConfiguration.ps1

      - name: Test MSBuild property escaping
        shell: pwsh
        run: >
          .\scripts\Test-MSBuildPropertyValue.Tests.ps1

      - name: Test OpenClaw build identity validation
        shell: pwsh
        run: >
          .\scripts\Test-OpenClawBuildIdentity.Tests.ps1

      - name: Test workflow package version
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowPackageVersion.Tests.ps1

      - name: Test packaging relevance
        shell: pwsh
        run: >
          .\scripts\Test-PackagingRelevance.Tests.ps1

      - name: Test OpenClaw cache keys
        shell: pwsh
        run: >
          .\scripts\Test-OpenClawCacheKey.Tests.ps1

      - name: Test OpenClaw package verification
        shell: pwsh
        run: >
          .\scripts\Test-OpenClawPackage.Tests.ps1

      - name: Test coverage reporting
        shell: pwsh
        run: >
          .\scripts\Test-Measure-Coverage.Tests.ps1

      - name: Test stable source selection
        shell: pwsh
        run: .\scripts\Test-OpenClawSource.Tests.ps1

      - name: Test local package deployment
        shell: pwsh
        run: >
          .\scripts\Test-Deploy-LocalPackage.Tests.ps1

      - name: Test MSIX release identity
        shell: pwsh
        run: >
          .\scripts\Test-MSIXReleaseIdentity.Tests.ps1

      - name: Test MSIX upgrade matrix
        shell: pwsh
        run: >
          .\scripts\Test-MSIXUpgradeMatrix.Tests.ps1

      - name: Test workflow job results
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowJobResults.Tests.ps1

      - name: Test MSIX bundle build
        shell: pwsh
        run: >
          .\scripts\Test-Build-MSIXBundle.Tests.ps1

      - name: Test payload tree copy
        shell: pwsh
        run: >
          .\scripts\Test-Copy-PayloadTree.Tests.ps1

      - name: Test Git hooks
        shell: pwsh
        run: >
          .\scripts\Test-GitHooks.Tests.ps1

      - name: Test documentation reference checker
        shell: pwsh
        run: >
          .\scripts\Test-DocReferences.Tests.ps1

      - name: Test Gateway isolation plugin
        shell: pwsh
        run: >
          .\scripts\Test-GatewayIsolationPlugin.Tests.ps1

      - name: Test native dependency redirect
        shell: pwsh
        run: >
          .\scripts\Test-NativeRedirect.Tests.ps1

  source-preflight:
    name: Capture source and validate build route
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.sha }}
      source_tag: ${{ steps.resolve.outputs.tag }}
      release_identity_tag: ${{ steps.resolve.outputs.release_identity_tag }}
      package_version: ${{ steps.resolve.outputs.version }}
      route: ${{ steps.resolve.outputs.route }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore source selection for a retry
        if: ${{ github.run_attempt != 1 }}
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: ${{ runner.temp }}/openclaw-source

      - name: Resolve immutable OpenClaw source
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.openclaw_ref }}
          GATEWAY_VERSION: ${{ inputs.gateway_version }}
          SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
        run: |
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'openclaw-source/source-resolution.json'
          $source = ./scripts/Get-WorkflowSource.ps1 `
            -PolicyPath ./release-policy.json `
            -OutputPath $snapshotPath `
            -Ref $env:SOURCE_REF `
            -GatewayVersion $env:GATEWAY_VERSION `
            -SigningMode $env:SIGNING_MODE `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -PackagingCommit $env:GITHUB_SHA `
            -WorkflowRef $env:GITHUB_WORKFLOW_REF -GitHubRef $env:GITHUB_REF -EventName $env:GITHUB_EVENT_NAME `
            -ReuseSnapshot:($env:GITHUB_RUN_ATTEMPT -ne '1')
          "route=$($source.buildRoute)" >> $env:GITHUB_OUTPUT
          "sha=$($source.resolvedCommit)" >> $env:GITHUB_OUTPUT
          "tag=v$($source.packageVersion)" >> $env:GITHUB_OUTPUT
          $releaseIdentitySource = if ($null -ne $source.PSObject.Properties['releaseIdentitySource']) {
            $source.releaseIdentitySource
          }
          else { $source }
          "release_identity_tag=$($releaseIdentitySource.releaseTag)" >> $env:GITHUB_OUTPUT
          "version=$($source.packageVersion)" >> $env:GITHUB_OUTPUT
          "OpenClaw $($source.packageVersion) ($($source.resolvedCommit)), selected by $($source.requestedRef); release identity $($releaseIdentitySource.releaseTag)." >> $env:GITHUB_STEP_SUMMARY

      - name: Save immutable source selection
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-source-resolution
          path: ${{ runner.temp }}/openclaw-source/source-resolution.json
          if-no-files-found: error
          retention-days: 90

  build-trusted:
    name: Build with write cache access
    needs: [changes, source-preflight]
    if: ${{ needs.source-preflight.outputs.route == 'trusted' }}
    cache-mode: write
    permissions:
      contents: read
    uses: ./.github/workflows/gateway-msix-build.yml
    with:
      source_ref: ${{ inputs.openclaw_ref || '' }}
      gateway_version: ${{ inputs.gateway_version || '' }}
      signing_mode: ${{ inputs.signing_mode || 'unsigned' }}
      versioning: ${{ needs.changes.outputs.versioning }}
      payload_artifact: ${{ needs.changes.outputs.payload_artifact }}
      cache_write: true

  build-read-only:
    name: Build with read cache access
    needs: [changes, source-preflight]
    if: ${{ needs.source-preflight.outputs.route == 'read-only' }}
    cache-mode: read
    permissions:
      contents: read
    uses: ./.github/workflows/gateway-msix-build.yml
    with:
      source_ref: ${{ inputs.openclaw_ref || '' }}
      gateway_version: ${{ inputs.gateway_version || '' }}
      signing_mode: ${{ inputs.signing_mode || 'unsigned' }}
      versioning: ${{ needs.changes.outputs.versioning }}
      payload_artifact: ${{ needs.changes.outputs.payload_artifact }}
      cache_write: false

  build:
    name: Validate selected build
    if: ${{ always() }}
    needs: [changes, source-preflight, build-trusted, build-read-only]
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_tag: ${{ steps.select.outputs.source_tag }}
      release_identity_tag: ${{ steps.select.outputs.release_identity_tag }}
      package_version: ${{ steps.select.outputs.package_version }}
      node_version: ${{ steps.select.outputs.node_version }}
      package_sha256: ${{ steps.select.outputs.package_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select exactly one successful route
        id: select
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
          PACKAGING_EXPECTED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true' }}
          EXPECTED_ROUTE: ${{ needs.source-preflight.outputs.route }}
        run: |
          $results = $env:RESULTS | ConvertFrom-Json
          if ($results.changes.result -cne 'success') { throw 'Change classification failed.' }
          $expected = $env:PACKAGING_EXPECTED -ceq 'true'
          if ($expected -and $results.'source-preflight'.result -cne 'success') { throw 'Source preflight failed.' }
          $outputs = ./scripts/Select-WorkflowBuild.ps1 `
            -PackagingExpected $expected `
            -ExpectedRoute $env:EXPECTED_ROUTE `
            -ExpectedSource $results.'source-preflight'.outputs `
            -Trusted $results.'build-trusted' -ReadOnly $results.'build-read-only'
          if ($null -ne $outputs) {
            foreach ($field in $outputs.PSObject.Properties) {
              "$($field.Name)=$($field.Value)" >> $env:GITHUB_OUTPUT
            }
          }

  test-sign-msix:
    cache-mode: none
    name: Test-sign Gateway MSIX packages
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'test' && needs.test-host.result == 'success' && needs.build.result == 'success' }}
    needs:
      - test-host
      - build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-arm64
          path: artifacts\arm64

      - name: Apply temporary test signature
        shell: pwsh
        run: |
          .\scripts\Sign-TestMSIX.ps1 `
            -ArtifactsDirectory artifacts `
            -OutputDirectory test-signed

      - name: Upload test-signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-x64
          path: test-signed\x64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload test-signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-arm64
          path: test-signed\arm64\
          if-no-files-found: error
          retention-days: 7

  test-msix-upgrades:
    cache-mode: none
    name: Test MSIX upgrade (${{ matrix.name }})
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.versioning == 'true' && needs.test-host.result == 'success' && needs.build.result == 'success' }}
    needs:
      - changes
      - test-host
      - build
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.upgrade_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifacts\${{ matrix.channel }}\${{ matrix.delivery_dir }}

      - name: Apply temporary test signature
        shell: pwsh
        env:
          CANDIDATE_CHANNEL: ${{ matrix.channel }}
        run: |
          .\scripts\Sign-TestMSIX.ps1 `
            -ArtifactsDirectory (Join-Path artifacts $env:CANDIDATE_CHANNEL) `
            -OutputDirectory (Join-Path test-signed $env:CANDIDATE_CHANNEL) `
            -IdentityChannel $env:CANDIDATE_CHANNEL

      - name: Download hash-pinned proof release
        if: ${{ matrix.transition_mode != 'store-in-place' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ASSET: ${{ matrix.baseline_asset }}
          BASELINE_RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          New-Item -Path baselines -ItemType Directory -Force | Out-Null
          & gh release download $env:BASELINE_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:BASELINE_ASSET `
            --dir baselines
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download $env:BASELINE_RELEASE_TAG upgrade baseline."
          }

      - name: Test package transition
        shell: pwsh
        env:
          GATEWAY_TAG: ${{ needs.build.outputs.release_identity_tag }}
          BASELINE_ASSET: ${{ matrix.baseline_asset }}
          CANDIDATE_CHANNEL: ${{ matrix.channel }}
          CANDIDATE_FILE: ${{ matrix.candidate_file }}
          DELIVERY_DIRECTORY: ${{ matrix.delivery_dir }}
          EVIDENCE_ID: ${{ matrix.id }}
          TRANSITION_MODE: ${{ matrix.transition_mode }}
        run: |
          $policy = Get-Content -LiteralPath .\release-policy.json -Raw |
            ConvertFrom-Json
          $identity = .\scripts\Get-MSIXReleaseIdentity.ps1 `
            -GatewayTag $env:GATEWAY_TAG `
            -MSIXRevision ([int]$policy.msixRevision)
          $candidateRoot = Join-Path `
            (Join-Path test-signed $env:CANDIDATE_CHANNEL) `
            $env:DELIVERY_DIRECTORY
          $candidatePath = Join-Path $candidateRoot $env:CANDIDATE_FILE
          $certificatePath = Join-Path `
            $candidateRoot `
            'OpenClawGateway-test-signing.cer'
          $evidencePath = Join-Path evidence "$env:EVIDENCE_ID.json"
          New-Item -Path evidence -ItemType Directory -Force | Out-Null
          if ($env:TRANSITION_MODE -ceq 'store-in-place') {
            .\scripts\Test-MSIXStoreUpgrade.ps1 `
              -CandidatePath $candidatePath `
              -CandidateCertificatePath $certificatePath `
              -ExpectedCandidateVersion $identity.PackageVersion `
              -StoreProductId '9NV70LV3D6XC' `
              -EvidencePath $evidencePath
          }
          else {
            .\scripts\Test-MSIXUpgrade.ps1 `
              -BaselinesPath .\scripts\msix-upgrade-baselines.json `
              -BaselinesDirectory baselines `
              -CandidatePath $candidatePath `
              -CandidateCertificatePath $certificatePath `
              -ExpectedCandidateVersion $identity.PackageVersion `
              -TransitionMode $env:TRANSITION_MODE `
              -BaselineAssetName $env:BASELINE_ASSET `
              -EvidencePath $evidencePath
          }

      - name: Upload transition evidence
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-upgrade-evidence-${{ matrix.id }}
          path: evidence\${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 90

  reject-untrusted-official-signing:
    cache-mode: none
    name: Reject release publication outside main
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.signing_mode == 'official' || inputs.signing_mode == 'store') && github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - name: Reject untrusted workflow ref
        shell: pwsh
        run: |
          throw (
            'Gateway MSIX release publication may be dispatched only from main. ' +
            'Use unsigned or test mode for other branches.'
          )

  authorize-signing:
    cache-mode: none
    name: Authorize Gateway MSIX release
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.signing_mode == 'official' || inputs.signing_mode == 'store') && github.ref == 'refs/heads/main' && needs.test-host.result == 'success' && needs.build.result == 'success' }}
    needs:
      - test-host
      - build
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      publisher: ${{ steps.release.outputs.publisher }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned Store x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-x64
          path: artifacts\store\x64

      - name: Download unsigned Store ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-arm64
          path: artifacts\store\arm64

      - name: Download unsigned Store bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-bundle
          path: artifacts\store\bundle

      - name: Download unsigned sideload x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-x64
          path: artifacts\sideload\x64

      - name: Download unsigned sideload ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-arm64
          path: artifacts\sideload\arm64

      - name: Download unsigned sideload bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-bundle
          path: artifacts\sideload\bundle

      - name: Download captured stable source
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: source-resolution

      - name: Resolve official release metadata
        id: release
        shell: pwsh
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          SOURCE_REF: ${{ inputs.openclaw_ref }}
          GATEWAY_VERSION: ${{ inputs.gateway_version }}
        run: |
          $source = .\scripts\Get-WorkflowSource.ps1 `
            -PolicyPath .\release-policy.json `
            -OutputPath source-resolution\source-resolution.json `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -PackagingCommit $env:GITHUB_SHA `
            -WorkflowRef $env:GITHUB_WORKFLOW_REF -GitHubRef $env:GITHUB_REF -EventName $env:GITHUB_EVENT_NAME `
            -SigningMode $env:SIGNING_MODE `
            -Ref $env:SOURCE_REF `
            -GatewayVersion $env:GATEWAY_VERSION `
            -ReuseSnapshot
          $policy = Get-Content -LiteralPath .\release-policy.json -Raw |
            ConvertFrom-Json
          $releaseIdentitySource = if ($null -ne $source.PSObject.Properties['releaseIdentitySource']) {
            $source.releaseIdentitySource
          }
          else { $source }
          $identity = .\scripts\Get-MSIXReleaseIdentity.ps1 `
            -GatewayTag $releaseIdentitySource.releaseTag `
            -MSIXRevision ([int]$policy.msixRevision)
          $packageVersion = .\scripts\Get-WorkflowPackageVersion.ps1 `
            -RunNumber '${{ github.run_number }}' `
            -RunAttempt '${{ github.run_attempt }}' `
            -ReleaseVersion $identity.PackageVersion

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$($identity.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "release_version=$($identity.ReleaseVersion)" >> $env:GITHUB_OUTPUT
          "publisher=$($policy.sideloadPackageIdentity.publisher)" >> $env:GITHUB_OUTPUT

      - name: Enforce reviewed release policy
        shell: pwsh
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          SOURCE_REF: ${{ inputs.openclaw_ref }}
          GATEWAY_VERSION: ${{ inputs.gateway_version }}
          PACKAGING_COMMIT: ${{ github.sha }}
        run: |
          foreach ($channel in @('Store', 'Sideload')) {
            $channelDirectory = $channel.ToLowerInvariant()
            .\scripts\Test-SigningInputs.ps1 `
              -ArtifactsDirectory "artifacts\$channelDirectory" `
              -PolicyPath .\release-policy.json `
              -BundlePath "artifacts\$channelDirectory\bundle\OpenClawGateway.msixbundle" `
              -SourcePath source-resolution\source-resolution.json `
              -RequestedRef $env:SOURCE_REF `
              -GatewayVersion $env:GATEWAY_VERSION `
              -WorkflowRunId $env:GITHUB_RUN_ID `
              -SigningMode $env:SIGNING_MODE `
              -PackagingCommit $env:PACKAGING_COMMIT `
              -WorkflowRef $env:GITHUB_WORKFLOW_REF -GitHubRef $env:GITHUB_REF -EventName $env:GITHUB_EVENT_NAME `
              -IdentityChannel $channel
          }

  sign-msix:
    cache-mode: none
    name: Officially sign Gateway MSIX packages
    if: ${{ !cancelled() && inputs.signing_mode == 'official' && needs.build.result == 'success' && needs.authorize-signing.result == 'success' }}
    needs:
      - build
      - authorize-signing
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-arm64
          path: artifacts\arm64

      - name: Download unsigned multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-sideload-unsigned-bundle
          path: artifacts\bundle

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign standalone MSIX packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: artifacts
          files-folder-filter: msix
          files-folder-recurse: true
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign multi-architecture MSIX bundle
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files: ${{ github.workspace }}\artifacts\bundle\OpenClawGateway.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and refresh metadata
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ needs.authorize-signing.outputs.publisher }}
        run: |
          $expectedSubject = $env:EXPECTED_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($expectedSubject)) {
            throw 'The authorized publisher subject was not provided to the signing job.'
          }
          foreach ($architecture in @('x64', 'arm64')) {
            $directory = Join-Path 'artifacts' $architecture
            $msix = Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File
            if (@($msix).Count -ne 1) {
              throw "Expected one signed MSIX in $directory."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $msix.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($msix.Name) signature status was $($signature.Status)."
            }
            if (-not [string]::Equals(
              $signature.SignerCertificate.Subject,
              $expectedSubject,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "$($msix.Name) signer was unexpected: $($signature.SignerCertificate.Subject)"
            }

            $metadataPath = Join-Path $directory 'msix-metadata.json'
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.sha256 = (
              Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata | ConvertTo-Json |
              Set-Content -LiteralPath $metadataPath -Encoding utf8
          }

          $bundle = Get-Item `
            -LiteralPath artifacts\bundle\OpenClawGateway.msixbundle
          $bundleSignature = Get-AuthenticodeSignature `
            -LiteralPath $bundle.FullName
          if ($bundleSignature.Status -ne 'Valid') {
            throw "$($bundle.Name) signature status was $($bundleSignature.Status)."
          }
          if (-not [string]::Equals(
            $bundleSignature.SignerCertificate.Subject,
            $expectedSubject,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw (
              "$($bundle.Name) signer was unexpected: " +
              $bundleSignature.SignerCertificate.Subject
            )
          }

      - name: Upload signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-x64
          path: artifacts\x64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-arm64
          path: artifacts\arm64\
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed multi-architecture MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-bundle
          path: artifacts\bundle\OpenClawGateway.msixbundle
          if-no-files-found: error
          retention-days: 7

  publish-release:
    cache-mode: none
    name: Publish signed Gateway MSIX release
    if: ${{ !cancelled() && inputs.publish_release && needs.build.result == 'success' && needs.authorize-signing.result == 'success' && needs.sign-msix.result == 'success' }}
    needs:
      - build
      - authorize-signing
      - sign-msix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-x64
          path: signed/x64

      - name: Download signed ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-arm64
          path: signed/arm64

      - name: Download signed multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-bundle
          path: signed/bundle

      - name: Stage versioned release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.authorize-signing.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp signed/x64/OpenClawGateway-x64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-x64.msix"
          cp signed/arm64/OpenClawGateway-arm64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-arm64.msix"
          cp signed/bundle/OpenClawGateway.msixbundle \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}.msixbundle"

      - name: Create permanent GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.authorize-signing.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: OpenClaw Gateway MSIX ${{ needs.authorize-signing.outputs.release_tag }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.msix
            release-assets/*.msixbundle
          body: |
            Packages OpenClaw `${{ needs.build.outputs.package_version }}`
            from [`openclaw/openclaw@${{ needs.build.outputs.source_sha }}`](https://github.com/openclaw/openclaw/commit/${{ needs.build.outputs.source_sha }}).

            ### Downloads
            - **Recommended:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}.msixbundle`
            - **x64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-x64.msix`
            - **ARM64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-arm64.msix`

            The packages are signed by OpenClaw Foundation through Azure Artifact Signing.

  retain-store-submission:
    cache-mode: none
    name: Retain authorized Microsoft Store submission bundle
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.authorize-signing.result == 'success' }}
    needs:
      - build
      - authorize-signing
    runs-on: windows-latest
    permissions:
      actions: read
    steps:
      - name: Download authorized unsigned Store bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-store-unsigned-bundle
          path: store

      - name: Stage versioned Store submission bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.authorize-signing.outputs.release_version }}
        run: |
          Rename-Item `
            -LiteralPath store\OpenClawGateway.msixbundle `
            -NewName "OpenClawGateway-$env:RELEASE_VERSION-store.msixbundle"

      - name: Upload Store submission bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-store-submission
          path: store\OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-store.msixbundle
          if-no-files-found: error
          retention-days: 90

  ci-gate:
    name: Gateway MSIX CI
    if: ${{ always() }}
    needs:
      - changes
      - test-host
      - build
      - test-sign-msix
      - test-msix-upgrades
      - reject-untrusted-official-signing
      - authorize-signing
      - sign-msix
      - publish-release
      - retain-store-submission
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: |
          echo "One or more required workflow jobs failed or were cancelled." >&2
          exit 1

      - name: Confirm workflow success
        shell: bash
        run: echo "All required workflow jobs succeeded or were intentionally skipped."

      - name: Require versioning upgrade tests
        if: ${{ always() }}
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSIONING: ${{ needs.changes.outputs.versioning }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_HOST_RESULT: ${{ needs.test-host.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPGRADE_RESULT: ${{ needs.test-msix-upgrades.result }}
        run: |
          ./scripts/Assert-WorkflowJobResults.ps1 `
            -EventName $env:EVENT_NAME `
            -Versioning $env:VERSIONING `
            -ChangesResult $env:CHANGES_RESULT `
            -TestHostResult $env:TEST_HOST_RESULT `
            -BuildResult $env:BUILD_RESULT `
            -UpgradeResult $env:UPGRADE_RESULT
