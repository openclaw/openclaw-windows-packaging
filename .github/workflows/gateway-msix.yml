name: Build OpenClaw Gateway MSIX

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openclaw_ref:
        description: Optional source override for unsigned/test builds; leave empty to follow the policy channel
        required: false
        default: ''
        type: string
      signing_mode:
        description: Package signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - test
          - official

permissions:
  contents: read

# Upstream build/install scripts must never receive cache read/write authority,
# including manually selected refs running in the default-branch context.
cache-mode: none

concurrency:
  group: gateway-msix-${{ inputs.signing_mode == 'official' && 'official' || github.run_id }}
  cancel-in-progress: false

env:
  PACKAGING_ROOT: .

jobs:
  resolve-source:
    name: Resolve immutable OpenClaw source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_version: ${{ steps.source.outputs.source_version }}
      snapshot_sha256: ${{ steps.source.outputs.snapshot_sha256 }}
      package_version: ${{ steps.source.outputs.package_version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore source snapshot for a retry
        if: ${{ github.run_attempt != 1 }}
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: ${{ runner.temp }}/openclaw-source

      - name: Resolve or reuse source snapshot
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.openclaw_ref }}
          SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
        run: |
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'openclaw-source/source-resolution.json'
          $source = ./scripts/Get-WorkflowSource.ps1 `
            -PolicyPath ./release-policy.json `
            -OutputPath $snapshotPath `
            -Ref $env:SOURCE_REF `
            -SigningMode $env:SIGNING_MODE `
            -RunNumber $env:GITHUB_RUN_NUMBER `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -PackagingCommit $env:GITHUB_SHA `
            -ReuseSnapshot:($env:GITHUB_RUN_ATTEMPT -ne '1')
          $hash = (Get-FileHash -LiteralPath $snapshotPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "source_sha=$($source.resolvedCommit)" >> $env:GITHUB_OUTPUT
          "source_version=$($source.packageVersion)" >> $env:GITHUB_OUTPUT
          "snapshot_sha256=$hash" >> $env:GITHUB_OUTPUT
          "package_version=$($source.msixPackageVersion)" >> $env:GITHUB_OUTPUT
          "release_tag=$($source.msixReleaseTag)" >> $env:GITHUB_OUTPUT
          @"
          ### OpenClaw source snapshot
          - Selector: ``$($source.requestedRef)``
          - Upstream version: ``$($source.packageVersion)``
          - Upstream release tag: ``$($source.releaseTag)``
          - Source commit: ``$($source.resolvedCommit)``
          - Resolved at (UTC): $($source.resolvedAt)
          - MSIX version: ``$($source.msixPackageVersion)``
          - Snapshot SHA-256: ``$hash``
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Save source snapshot
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-source-resolution
          path: ${{ runner.temp }}/openclaw-source/source-resolution.json
          if-no-files-found: error
          retention-days: 90

  test-host:
    name: Test Gateway MSIX host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\OpenClaw.Gateway.MSIX.slnx

      - name: Static analysis
        shell: pwsh
        run: >
          .\scripts\Test-DotNetQuality.ps1
          -Configuration Release
          -SkipRestore

      - name: Test
        run: >
          dotnet test .\OpenClaw.Gateway.MSIX.slnx
          --configuration Release
          --no-restore

      # The xUnit suite runs under a JIT test host, so it cannot prove the
      # native entrypoint alias and root command name, or that
      # System.CommandLine survives trimming and ahead-of-time compilation.
      # This publishes the scenario driver in tests\OpenClaw.Launcher.AotSmoke,
      # which runs the shared startup path with fixture-owned diagnostics
      # instead of the production Main, so nothing is written outside the
      # temporary directory the script owns. x64 only: windows-latest cannot
      # execute an ARM64 binary, and both architectures are still compiled by
      # the packaging matrix.
      - name: Test NativeAOT clawctl command line
        shell: pwsh
        run: >
          .\scripts\Test-NativeAotCli.Tests.ps1
          -Configuration Release

      - name: Test signing policy
        shell: pwsh
        run: >
          .\scripts\Test-SigningInputs.Tests.ps1

      - name: Test Node.js packaging inputs
        shell: pwsh
        run: .\scripts\Test-NodeRuntimeInputs.Tests.ps1

      - name: Test signing workflow configuration
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowSigningConfiguration.ps1

      - name: Test OpenClaw build identity validation
        shell: pwsh
        run: >
          .\scripts\Test-OpenClawBuildIdentity.Tests.ps1

      - name: Test workflow package version
        shell: pwsh
        run: >
          .\scripts\Test-WorkflowPackageVersion.Tests.ps1

      - name: Test local package deployment
        shell: pwsh
        run: >
          .\scripts\Test-Deploy-LocalPackage.Tests.ps1

      - name: Test channel resolution and source snapshots
        shell: pwsh
        run: |
          .\scripts\Test-OpenClawSource.Tests.ps1
          .\scripts\Test-WorkflowSource.Tests.ps1

      - name: Test MSIX bundle build
        shell: pwsh
        run: >
          .\scripts\Test-Build-MSIXBundle.Tests.ps1

      - name: Test Git hooks
        shell: pwsh
        run: >
          .\scripts\Test-GitHooks.Tests.ps1

  build-package:
    name: Build OpenClaw npm package
    needs: resolve-source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_version: ${{ steps.source.outputs.version }}
      node_version: ${{ steps.source.outputs.node_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The OpenClaw checkout below must own GITHUB_WORKSPACE because its
      # composite setup action resolves workspace files from that root. Keep
      # the packaging-owned validator outside the workspace before replacing
      # this checkout with the OpenClaw source tree.
      - name: Stage build identity validator
        shell: pwsh
        run: >
          Copy-Item
          ./scripts/Test-OpenClawBuildIdentity.ps1
          $env:RUNNER_TEMP/Test-OpenClawBuildIdentity.ps1

      - name: Download immutable source snapshot
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: ${{ runner.temp }}/openclaw-source

      - name: Check out OpenClaw source
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up upstream Node.js and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "false"
          use-actions-cache: "false"
          save-actions-cache: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: pnpm build

      - name: Validate OpenClaw build identities
        shell: pwsh
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_sha }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.resolve-source.outputs.source_version }}
        run: >
          & "$env:RUNNER_TEMP/Test-OpenClawBuildIdentity.ps1"
          -OpenClawDirectory $env:GITHUB_WORKSPACE
          -ExpectedSourceCommit $env:EXPECTED_SOURCE_COMMIT
          -ExpectedPackageVersion $env:EXPECTED_PACKAGE_VERSION

      - name: Pack npm package
        id: source
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/openclaw-package"
          mkdir -p "${artifact_dir}"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --skip-build \
            --pnpm-pack \
            --output-dir "${artifact_dir}" \
            --output-name openclaw.tgz

          source_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          node_version="$(node -p 'process.versions.node')"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "node_version=${node_version}" >> "${GITHUB_OUTPUT}"

      - name: Record and verify source build identity
        shell: pwsh
        env:
          EXPECTED_SNAPSHOT_HASH: ${{ needs.resolve-source.outputs.snapshot_sha256 }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
          BUILT_VERSION: ${{ steps.source.outputs.version }}
          NODE_VERSION: ${{ steps.source.outputs.node_version }}
        run: |
          $snapshotPath = Join-Path $env:RUNNER_TEMP 'openclaw-source/source-resolution.json'
          $hash = (Get-FileHash -LiteralPath $snapshotPath -Algorithm SHA256).Hash
          if ($hash -ine $env:EXPECTED_SNAPSHOT_HASH) {
            throw 'The source snapshot does not match the resolver output.'
          }
          $source = Get-Content -LiteralPath $snapshotPath -Raw | ConvertFrom-Json
          if ($source.resolvedCommit -cne $env:BUILT_SHA -or
              $source.packageVersion -cne $env:BUILT_VERSION -or
              $env:NODE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'The source build does not match the resolved OpenClaw identity.'
          }
          $source | Add-Member -NotePropertyName nodeVersion -NotePropertyValue $env:NODE_VERSION
          $source | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'openclaw-package/source.json') -Encoding utf8

      - name: Upload intermediate package
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}/openclaw-package/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build-payload:
    name: Build ${{ matrix.architecture }} gateway payload
    needs: build-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.build-package.outputs.node_version }}

      - name: Download intermediate package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-npm-package
          path: ${{ runner.temp }}\openclaw-package

      - name: Build expanded payload
        shell: pwsh
        run: |
          .\scripts\Build-Payload.ps1 `
            -PackageDirectory '${{ runner.temp }}\openclaw-package' `
            -Architecture '${{ matrix.architecture }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-payload'

      - name: Upload payload
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload\
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build-msix:
    name: Build unsigned ${{ matrix.architecture }} Gateway MSIX
    needs:
      - resolve-source
      - test-host
      - build-payload
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download payload
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-payload-${{ matrix.architecture }}
          path: ${{ runner.temp }}\openclaw-payload

      - name: Restore NativeAOT and MSIX dependencies
        shell: pwsh
        run: |
          dotnet restore `
            .\src\OpenClaw.Launcher\OpenClaw.Launcher.csproj `
            --runtime 'win-${{ matrix.architecture }}' `
            -p:PublishAot=true `
            -p:IncludePackagingContent=true `
            -p:Platform='${{ matrix.architecture }}'

      - name: Compose unsigned MSIX
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.resolve-source.outputs.package_version }}
        run: |
          .\scripts\Build-MSIX.ps1 `
            -PayloadDirectory '${{ runner.temp }}\openclaw-payload' `
            -Architecture '${{ matrix.architecture }}' `
            -PackageVersion $env:PACKAGE_VERSION `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\openclaw-msix'

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-unsigned-${{ matrix.architecture }}
          overwrite: true
          path: |
            ${{ runner.temp }}\openclaw-msix\OpenClawGateway-${{ matrix.architecture }}.msix
            ${{ runner.temp }}\openclaw-msix\msix-metadata.json
          if-no-files-found: error
          retention-days: 7

  test-sign-msix:
    name: Test-sign Gateway MSIX packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'test' }}
    needs: build-msix
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Apply temporary test signature
        shell: pwsh
        run: |
          .\scripts\Sign-TestMSIX.ps1 `
            -ArtifactsDirectory artifacts `
            -OutputDirectory test-signed

      - name: Upload test-signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-x64
          path: test-signed\x64\
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload test-signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-test-signed-arm64
          path: test-signed\arm64\
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build-msix-bundle:
    name: Build unsigned multi-architecture Gateway MSIX bundle
    needs:
      - resolve-source
      - build-msix
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Compose unsigned multi-architecture MSIX bundle
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.resolve-source.outputs.package_version }}
        run: |
          .\scripts\Build-MSIXBundle.ps1 `
            -X64Package artifacts\x64\OpenClawGateway-x64.msix `
            -Arm64Package artifacts\arm64\OpenClawGateway-arm64.msix `
            -PackageVersion $env:PACKAGE_VERSION `
            -OutputPath artifacts\bundle\OpenClawGateway.msixbundle

      - name: Upload unsigned multi-architecture MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle\OpenClawGateway.msixbundle
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  reject-untrusted-official-signing:
    name: Reject official signing outside main
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'official' && github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - name: Reject untrusted workflow ref
        shell: pwsh
        run: |
          throw (
            'Official Gateway MSIX signing may be dispatched only from main. ' +
            'Use unsigned or test mode for other branches.'
          )

  authorize-signing:
    name: Authorize official Gateway MSIX signing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'official' && github.ref == 'refs/heads/main' }}
    needs:
      - resolve-source
      - build-msix
      - build-msix-bundle
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Download unsigned multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle

      - name: Download immutable source snapshot
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: artifacts\source

      - name: Resolve official release metadata
        id: release
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.resolve-source.outputs.package_version }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
        run: |
          "package_version=$env:PACKAGE_VERSION" >> $env:GITHUB_OUTPUT
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "release_version=$env:PACKAGE_VERSION" >> $env:GITHUB_OUTPUT

      - name: Enforce official signing policy
        shell: pwsh
        env:
          PACKAGING_COMMIT: ${{ github.sha }}
          SNAPSHOT_SHA256: ${{ needs.resolve-source.outputs.snapshot_sha256 }}
        run: |
          .\scripts\Test-SigningInputs.ps1 `
            -ArtifactsDirectory artifacts `
            -PolicyPath .\release-policy.json `
            -BundlePath artifacts\bundle\OpenClawGateway.msixbundle `
            -SourceResolutionPath artifacts\source\source-resolution.json `
            -SourceResolutionSha256 $env:SNAPSHOT_SHA256 `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -PackagingCommit $env:PACKAGING_COMMIT

      - name: Reject duplicate or older official releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.resolve-source.outputs.package_version }}
        run: |
          .\scripts\Test-OfficialReleaseVersion.ps1 `
            -PackageVersion $env:PACKAGE_VERSION

  sign-msix:
    name: Officially sign Gateway MSIX packages
    if: ${{ needs.authorize-signing.result == 'success' }}
    needs:
      - build-msix
      - build-msix-bundle
      - authorize-signing
    runs-on: windows-latest
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download unsigned x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-x64
          path: artifacts\x64

      - name: Download unsigned ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-arm64
          path: artifacts\arm64

      - name: Download unsigned multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-unsigned-bundle
          path: artifacts\bundle

      - name: Recheck official release version before signing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.authorize-signing.outputs.package_version }}
        run: |
          .\scripts\Test-OfficialReleaseVersion.ps1 `
            -PackageVersion $env:PACKAGE_VERSION

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign standalone MSIX packages
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: artifacts
          files-folder-filter: msix
          files-folder-recurse: true
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign multi-architecture MSIX bundle
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files: ${{ github.workspace }}\artifacts\bundle\OpenClawGateway.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and refresh metadata
        shell: pwsh
        run: |
          $expectedSubject = 'CN=OpenClaw Foundation, O=OpenClaw Foundation, L=Mill Valley, S=California, C=US'
          foreach ($architecture in @('x64', 'arm64')) {
            $directory = Join-Path 'artifacts' $architecture
            $msix = Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File
            if (@($msix).Count -ne 1) {
              throw "Expected one signed MSIX in $directory."
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $msix.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($msix.Name) signature status was $($signature.Status)."
            }
            if (-not [string]::Equals(
              $signature.SignerCertificate.Subject,
              $expectedSubject,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "$($msix.Name) signer was unexpected: $($signature.SignerCertificate.Subject)"
            }

            $metadataPath = Join-Path $directory 'msix-metadata.json'
            $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
            $metadata.sha256 = (
              Get-FileHash -LiteralPath $msix.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata | ConvertTo-Json |
              Set-Content -LiteralPath $metadataPath -Encoding utf8
          }

          $bundle = Get-Item `
            -LiteralPath artifacts\bundle\OpenClawGateway.msixbundle
          $bundleSignature = Get-AuthenticodeSignature `
            -LiteralPath $bundle.FullName
          if ($bundleSignature.Status -ne 'Valid') {
            throw "$($bundle.Name) signature status was $($bundleSignature.Status)."
          }
          if (-not [string]::Equals(
            $bundleSignature.SignerCertificate.Subject,
            $expectedSubject,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw (
              "$($bundle.Name) signer was unexpected: " +
              $bundleSignature.SignerCertificate.Subject
            )
          }

      - name: Upload signed x64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-x64
          path: artifacts\x64\
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed ARM64 MSIX
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-arm64
          path: artifacts\arm64\
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed multi-architecture MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: openclaw-gateway-msix-bundle
          path: artifacts\bundle\OpenClawGateway.msixbundle
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish signed Gateway MSIX release
    if: ${{ needs.sign-msix.result == 'success' }}
    needs:
      - resolve-source
      - authorize-signing
      - sign-msix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download signed x64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-x64
          path: signed/x64

      - name: Download signed ARM64 package
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-arm64
          path: signed/arm64

      - name: Download signed multi-architecture bundle
        uses: actions/download-artifact@v8
        with:
          name: openclaw-gateway-msix-bundle
          path: signed/bundle

      - name: Download immutable source snapshot
        uses: actions/download-artifact@v8
        with:
          name: openclaw-source-resolution
          path: signed/source

      - name: Stage versioned release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.authorize-signing.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp signed/x64/OpenClawGateway-x64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-x64.msix"
          cp signed/arm64/OpenClawGateway-arm64.msix \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}-arm64.msix"
          cp signed/bundle/OpenClawGateway.msixbundle \
            "release-assets/OpenClawGateway-${RELEASE_VERSION}.msixbundle"
          cp signed/source/source-resolution.json release-assets/source-resolution.json
          cp signed/x64/msix-metadata.json release-assets/msix-metadata-x64.json
          cp signed/arm64/msix-metadata.json release-assets/msix-metadata-arm64.json

      - name: Recheck official release version before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.authorize-signing.outputs.package_version }}
        run: |
          ./scripts/Test-OfficialReleaseVersion.ps1 `
            -PackageVersion $env:PACKAGE_VERSION

      - name: Create permanent GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.authorize-signing.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: OpenClaw Gateway MSIX ${{ needs.authorize-signing.outputs.release_tag }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.msix
            release-assets/*.msixbundle
            release-assets/*.json
          body: |
            Packages OpenClaw `${{ needs.resolve-source.outputs.source_version }}` selected
            from the upstream `extended-stable` channel for this workflow run,
            from [`openclaw/openclaw@${{ needs.resolve-source.outputs.source_sha }}`](https://github.com/openclaw/openclaw/commit/${{ needs.resolve-source.outputs.source_sha }}).
            The source snapshot and architecture metadata are included as release assets.

            ### Downloads
            - **Recommended:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}.msixbundle`
            - **x64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-x64.msix`
            - **ARM64:** `OpenClawGateway-${{ needs.authorize-signing.outputs.release_version }}-arm64.msix`

            The packages are signed by OpenClaw Foundation through Azure Artifact Signing.
