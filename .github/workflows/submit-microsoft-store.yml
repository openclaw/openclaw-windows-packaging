name: Request Microsoft Store publication

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful release workflow run containing the authorized Store bundle
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: microsoft-store-request
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'openclaw/openclaw-windows-packaging' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out request adapter
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mint request-only release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: 2729701
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: releases
          permission-actions: write

      - name: Request release-manager-approved Store publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          $request = ./scripts/Request-MicrosoftStorePublish.ps1 -RunId $env:SOURCE_RUN_ID
          "Store publication requested for Gateway source run $($request.sourceRunId)." >> $env:GITHUB_STEP_SUMMARY
          'Follow [Windows Store publication](https://github.com/openclaw/releases/actions/workflows/windows-store-publish.yml) for release-manager approval and the Store receipt. This request is not Store acceptance.' >> $env:GITHUB_STEP_SUMMARY
